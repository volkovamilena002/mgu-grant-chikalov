<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
:root{--bg:#0d1117;--panel:#0b0f14;--bar:#161b22;--line:#262d36;--text:#d7dde5;--dim:#7d8896;--cy:#56d4dd;--am:#f2b84b;--bl:#79b8ff;--gr:#7ee787;--rd:#ff7b72;--pu:#d2a8ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;background:var(--bg);overflow:hidden}
body{height:100vh}
#frame{width:1280px;height:100vh;display:flex;flex-direction:column;font-family:"Segoe UI",Arial,sans-serif;color:var(--text)}
#top{height:34px;flex:none;background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:8px;font-size:14px;color:var(--dim)}
#top i{width:11px;height:11px;border-radius:50%;display:inline-block}
#top i:nth-child(1){background:#ff5f56}#top i:nth-child(2){background:#ffbd2e}#top i:nth-child(3){background:#27c93f}
#ttl{margin-left:10px;font-family:Consolas,monospace}
#plaque{height:32px;flex:none;display:flex;align-items:center;padding:0 22px;font-size:16px;font-weight:600;letter-spacing:.1px;border-bottom:1px solid var(--line)}
#plaque.recon{background:#3a2d0b;color:var(--am)}
#plaque.live{background:#0b2f33;color:var(--cy)}
#plaque.doc{background:#14243a;color:var(--bl)}
#plaque.none{background:var(--bg);color:var(--dim)}
#main{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--panel)}
#cap{height:68px;flex:none;background:#05080c;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 60px;font-size:21px;line-height:1.25;color:#f1f4f8}
/* терминал */
#term{position:absolute;left:0;right:0;bottom:0;padding:10px 24px 12px;font-family:Consolas,"Cascadia Mono",monospace;font-size:17px;line-height:1.34;white-space:pre-wrap;word-break:break-word}
#term .it{margin:0 0 3px}
.user{background:#12263f;border-left:4px solid var(--bl);padding:5px 10px;margin:8px 0 7px!important;color:#e8f1ff}
.user .pr{color:var(--bl);font-weight:700}
.agent{color:var(--text);margin:6px 0 6px!important}
.agent .dot{color:var(--gr)}
.agent b{color:#fff}
.tool{color:var(--cy);margin:5px 0 2px!important}
.tool .nm{font-weight:700}
.tool .ar{color:#9fb7c9}
.cmd{color:#fff;margin:9px 0 3px!important}
.cmd .ps{color:var(--gr);font-weight:700}
.out{color:#aab4c0}
.doc{color:#c8d2de}
.doc .h1{color:var(--am);font-weight:700;font-size:1.12em}
.doc .h2{color:var(--am);font-weight:700}
.doc .tb{color:#9ccfe0}
.note{color:var(--dim);font-style:italic;margin:8px 0 3px!important}
.skip{background:#3a2d0b;color:var(--am);font-weight:700;padding:6px 12px;margin:9px 0!important;border-radius:4px;font-family:"Segoe UI",Arial,sans-serif;font-size:1em}
.ref{color:var(--pu);font-weight:700}
.ok{color:var(--gr)} .warn{color:var(--am)} .bad{color:var(--rd)}
code{color:#ffd8a8;background:#1c2330;padding:0 4px;border-radius:3px}
.cur{display:inline-block;width:.55em;height:1.05em;background:#cfd8e3;vertical-align:text-bottom;margin-left:1px}
.ask{border:1px solid #3b4757;border-radius:6px;background:#10161e;padding:10px 14px;margin:9px 0!important;font-family:"Segoe UI",Arial,sans-serif}
.ask .hd{display:inline-block;background:var(--am);color:#1b1500;font-weight:800;font-size:.82em;padding:1px 8px;border-radius:3px;margin-bottom:6px}
.ask .q{margin-bottom:8px;line-height:1.3}
.ask .op{padding:3px 10px;margin:3px 0;border:1px solid #2c3644;border-radius:4px;color:#b9c4d0}
.ask .op small{display:block;color:var(--dim);font-size:.82em}
.ask .op.sel{border-color:var(--gr);background:#12301c;color:#eaffee}
.ask .op.sel:before{content:"✔ ";color:var(--gr)}
/* слайды */
#slide{position:absolute;inset:0;padding:42px 72px;display:none;flex-direction:column;gap:16px;background:radial-gradient(1200px 500px at 20% 0%,#16243a 0%,#0d1117 70%)}
#slide .h1{font-size:46px;font-weight:800;line-height:1.1;color:#fff}
#slide .sub{font-size:26px;line-height:1.3;color:#b9c7d8}
#slide .b{font-size:25px;line-height:1.3;padding-left:30px;position:relative;color:var(--text)}
#slide .b:before{content:"";position:absolute;left:4px;top:.55em;width:10px;height:10px;border-radius:2px;background:var(--cy)}
#slide .note{font-size:18px;color:var(--dim);font-style:italic;font-family:inherit}
#slide .chips{display:flex;gap:12px;flex-wrap:wrap;margin:4px 0 6px}
#slide .chip{font-size:22px;font-weight:700;padding:5px 16px;border-radius:20px;border:2px solid}
#slide .big{font-size:38px;font-weight:800;color:var(--gr);font-family:Consolas,monospace;margin-top:6px}
#slide table{border-collapse:collapse;width:100%;font-size:16px;margin-top:4px}
#slide th{background:#1b2a40;color:#fff;text-align:left;padding:7px 9px;border:1px solid #2c3b52;font-size:15px;vertical-align:top}
#slide td{padding:7px 9px;border:1px solid #2c3b52;vertical-align:top;line-height:1.25;color:#cfd8e3}
#slide td:first-child{font-weight:700;color:#fff;background:#101a2a}
#slide td.g{color:var(--gr)}#slide td.r{color:var(--rd)}#slide td.a{color:var(--am)}
#slide .kv{display:grid;grid-template-columns:260px 1fr;gap:6px 18px;font-size:22px;line-height:1.28}
#slide .kv .k{color:var(--am);font-weight:700}
</style></head>
<body><div id="frame">
<div id="top"><i></i><i></i><i></i><span id="ttl"></span></div>
<div id="plaque" class="none"></div>
<div id="main"><div id="term"></div><div id="slide"></div></div>
<div id="cap"></div>
</div>
<script>
let TL = null;
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const REF = /\[(?:[CSQD]\d+(?:\s*[,–-]\s*[CSQD]?\d+)*)\]/g;
const mark = s => esc(s).replace(REF, m => '<span class="ref">'+m+'</span>');
function md(raw){
  let s = raw;
  if ((s.match(/\*\*/g)||[]).length % 2) s += "**";
  if ((s.match(/`/g)||[]).length % 2) s += "`";
  return mark(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
}
const clamp = (x,a=0,b=1) => Math.max(a,Math.min(b,x));
function lineClass(l){
  if (/^(#\s)/.test(l)) return "h1"; if (/^##/.test(l)) return "h2"; if (/^\|/.test(l)) return "tb"; return "";
}
function outLine(l, doc){
  let h = mark(l);
  h = h.replace(/(ошибок 0, предупреждений 0\.?)/,'<span class="ok">$1</span>').replace(/^(\s*)(G\d: approved)/,'$1<span class="ok">$2</span>')
       .replace(/(ПРЕДУПРЕЖДЕНИЯ \(\d+\):)/,'<span class="warn">$1</span>').replace(/(Итог: ошибок \d+, предупреждений [1-9]\d*\.)/,'<span class="warn">$1</span>');
  if (doc){ const c = lineClass(l); if (c) h = '<span class="'+c+'">'+h+'</span>'; }
  return h;
}
function renderItem(it, t){
  const f = clamp((t - it.start) / it.dur);
  const k = it.k;
  if (k==="user"){ const n=Math.ceil(f*it.text.length); return ['<div class="it user"><span class="pr">&gt; </span>'+mark(it.text.slice(0,n))+(f<1?'<span class="cur"></span>':'')+'</div>', n]; }
  if (k==="agent"){ const n=Math.ceil(f*it.text.length); return ['<div class="it agent"><span class="dot">● </span>'+md(it.text.slice(0,n))+'</div>', n]; }
  if (k==="tool"){ const n=Math.ceil(f*it.args.length); return ['<div class="it tool"><span class="nm">● '+esc(it.name)+'</span><span class="ar">('+esc(it.args.slice(0,n))+(f<1?'':')')+'</span></div>', n]; }
  if (k==="cmd"){ const n=Math.ceil(f*it.text.length); return ['<div class="it cmd"><span class="ps">$ </span>'+esc(it.text.slice(0,n))+(f<1?'<span class="cur"></span>':'')+'</div>', n]; }
  if (k==="out"||k==="doc"){ const n=Math.ceil(f*it.lines.length); return ['<div class="it '+k+'">'+it.lines.slice(0,n).map(l=>outLine(l,k==="doc")).join("\n")+'</div>', n]; }
  if (k==="note") return ['<div class="it note">'+esc(it.text)+'</div>', 1];
  if (k==="skip") return ['<div class="it skip">⏩ '+esc(it.text)+'</div>', 1];
  if (k==="gap") return ['<div class="it" style="height:8px"></div>', 1];
  if (k==="ask"){
    const nq=Math.ceil(clamp(f/0.5)*it.q.length), showOps=f>0.5, sel=f>0.8;
    let h='<div class="it ask"><span class="hd">'+esc(it.header)+'</span><div class="q">'+mark(it.q.slice(0,nq))+'</div>';
    if (showOps) h+=it.opts.map((o,i)=>'<div class="op'+(sel&&i===it.chosen?' sel':'')+'">'+esc(o.label)+(o.desc?'<small>'+esc(o.desc)+'</small>':'')+'</div>').join("");
    return [h+'</div>', nq+(showOps?1000:0)+(sel?5000:0)];
  }
  return ['',0];
}
function renderSlideItem(it, t){
  const f = clamp((t - it.start) / Math.max(0.01,it.dur));
  const op = clamp(f*3).toFixed(2), k = it.k;
  const st = ' style="opacity:'+op+'"';
  if (k==="h1") return ['<div class="h1"'+st+'>'+esc(it.text)+'</div>', op];
  if (k==="sub") return ['<div class="sub"'+st+'>'+mark(it.text)+'</div>', op];
  if (k==="b") return ['<div class="b"'+st+'>'+mark(it.text)+'</div>', op];
  if (k==="note") return ['<div class="note"'+st+'>'+esc(it.text)+'</div>', op];
  if (k==="big") return ['<div class="big"'+st+'>'+esc(it.text)+'</div>', op];
  if (k==="chips") return ['<div class="chips"'+st+'>'+it.chips.map(c=>'<span class="chip" style="color:'+c[1]+';border-color:'+c[1]+'">'+esc(c[0])+'</span>').join("")+'</div>', op];
  if (k==="kv") { const n=Math.ceil(f*it.rows.length); return ['<div class="kv">'+it.rows.slice(0,n).map(r=>'<div class="k">'+esc(r[0])+'</div><div>'+mark(r[1])+'</div>').join("")+'</div>', n]; }
  if (k==="table"){
    const n=Math.ceil(f*it.rows.length);
    const cls = c => /^(да|высокая)/i.test(c)?"g":/^(нет|низкая|ничего|маловероятно)/i.test(c)?"r":/^(слабо|неизвестно|средняя|вероятно)/i.test(c)?"a":"";
    const h='<table><tr>'+it.head.map(c=>'<th>'+esc(c)+'</th>').join("")+'</tr>'+it.rows.slice(0,n).map(r=>'<tr>'+r.map((c,i)=>'<td class="'+(i?cls(c):"")+'">'+mark(c)+'</td>').join("")+'</tr>').join("")+'</table>';
    return [h, n];
  }
  return ['',0];
}
window.load = tl => { TL = tl; };
window.renderAt = (t, fsOverride) => {
  const sc = TL.scenes.filter(s => s.start <= t + 1e-6).pop() || TL.scenes[0];
  const pl = document.getElementById("plaque");
  pl.className = sc.plaque.kind; pl.textContent = sc.plaque.text;
  document.getElementById("ttl").textContent = sc.layout === "slide" ? "Стратег Фабрики продуктов" : (sc.plaque.kind==="live" ? "Терминал · university-grant-2" : "Claude Code · university-grant-2");
  const term = document.getElementById("term"), slide = document.getElementById("slide");
  let sig = [sc.id, sc.plaque.text];
  if (sc.layout === "slide"){
    term.style.display = "none"; slide.style.display = "flex";
    const parts = sc.items.filter(it => it.start <= t).map(it => renderSlideItem(it, t));
    slide.innerHTML = parts.map(p => p[0]).join(""); sig.push(parts.map(p => p[1]).join(","));
  } else {
    slide.style.display = "none"; term.style.display = "block";
    term.style.fontSize = (fsOverride || sc.fs || 17) + "px";
    const all = [];
    if (sc.carry) for (const it of sc.carry) all.push(renderItem(it, 1e9));
    let startIdx = 0;
    const live = sc.items.filter(it => it.start <= t);
    const cl = live.map((it,i)=>[it,i]).filter(x => x[0].k === "clear").pop();
    const vis = cl ? live.slice(cl[1]+1) : live;
    const parts = (cl ? [] : all).concat(vis.filter(it=>it.k!=="clear").map(it => renderItem(it, t)));
    term.innerHTML = parts.map(p => p[0]).join(""); sig.push(parts.map(p => p[1]).join(","));
  }
  // подпись
  const ph = sc.phrases.filter(p => p.start <= t + 1e-6 && t < sc.end).pop();
  const cap = document.getElementById("cap"); const text = ph ? ph.text : "";
  if (cap.textContent !== text) cap.textContent = text;
  sig.push(text);
  return sig.join("|");
};
</script></body></html>
